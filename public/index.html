<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEVILS CHEAT PANEL</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>💀 DEVILS WILL RISE</h1>
    <div class="key-section">
      <input type="text" id="keyInput" placeholder="Nhập key...">
      <button id="verifyBtn">Kích hoạt</button>
      <span id="status"></span>
    </div>
    <div class="features" id="featureList">
      <label><input type="checkbox" class="feature" value="aimlock"> Aim Lock</label>
      <label><input type="checkbox" class="feature" value="nhetam"> Nhẹ Tâm</label>
      <label><input type="checkbox" class="feature" value="bamdau"> Bám Đầu</label>
      <label><input type="checkbox" class="feature" value="fixlo"> Fix Lố</label>
      <label><input type="checkbox" class="feature" value="fixrung"> Fix Rung</label>
    </div>
    <button id="selectAllBtn">✅ Chọn tất cả</button>
    <button id="applyBtn">🔥 Áp dụng</button>
    <div id="result"></div>
  </div>

  <div style="margin-top:30px; text-align:center; color:#aaa; font-size:14px;">

    <!-- ===== PHẦN GET KEY (LUÔN HIỆN) ===== -->
    <div style="margin-top:20px; border-top:1px solid #0ff; padding-top:15px;">
      <h3>🔑 GET KEY</h3>
      <div>
        <input type="password" id="passInput" placeholder="Nhập mật khẩu..." style="padding:8px; width:60%; border-radius:6px; border:1px solid #0ff; background:#222; color:#0ff;">
        <button id="checkPassBtn">🔓 Xác nhận</button>
      </div>
      <p id="passResult" style="margin-top:10px;"></p>
    </div>

    <!-- ===== PHẦN GEN KEY (ẨN MẶC ĐỊNH) ===== -->
    <div id="genKeySection" style="display:none; margin-top:20px; border-top:1px solid #0ff; padding-top:15px;">
      <h3>🔧 TẠO KEY</h3>
      <div>
        <select id="durationSelect" style="padding:8px; background:#222; color:#0ff; border:1px solid #0ff; border-radius:6px;">
          <option value="1d">1 ngày</option>
          <option value="7d" selected>7 ngày</option>
          <option value="30d">30 ngày</option>
          <option value="1y">1 năm</option>
        </select>
        <button id="genKeyBtn">⚡ Tạo key</button>
      </div>
      <p id="newKeyDisplay" style="color:#0f0; margin-top:10px;"></p>
    </div>

  </div>
  <script src="script.js"></script>
</body>
</html>
